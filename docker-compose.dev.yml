version: '3.8'

services:
  # Banco de Dados Oracle para Desenvolvimento
  oracle-db:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: ecotrack-oracle-dev
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - APP_USER=ecotrack
      - APP_USER_PASSWORD=${ORACLE_PASSWORD}
    volumes:
      - oracle_dev_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Aplicação EcoTrack para Desenvolvimento
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecotrack-app-dev
    ports:
      - "8080:8080"
      - "8081:8081" # Management port
      - "5005:5005"  # Debug port
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      # Spring Boot Configuration
      - SPRING_APPLICATION_NAME=mobilidade-sustentavel
      - SPRING_PROFILES_ACTIVE=docker,development
      
      # Database Configuration
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=ecotrack
      - SPRING_DATASOURCE_PASSWORD=${ORACLE_PASSWORD}
      
      # JPA/Hibernate Configuration
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_JPA_SHOW_SQL=true
      
      # Flyway Configuration
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      
      # Security Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}

      # AI Integration
      - SPRING_SECRET_AI_KEY=${SPRING_SECRET_AI_KEY}
      
      # Actuator Configuration
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SERVER_PORT=8081
      
      # Debug Configuration
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      
      # Logging Configuration
      - LOGGING_LEVEL_BR_COM_FIAP_ESG=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
      
    volumes:
      - app_dev_logs:/app/logs
      # Mount source code for hot reload (opcional)
      # - ./src:/app/src:ro
    restart: unless-stopped

volumes:
  oracle_dev_data:
    driver: local
  app_dev_logs:
    driver: local