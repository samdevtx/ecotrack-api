version: '3.8'

services:
  # Banco de Dados PostgreSQL para Desenvolvimento
  postgres:
    image: postgres:16-alpine
    container_name: ecotrack-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ecotrack
      - POSTGRES_USER=ecotrack
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotrack -d ecotrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Aplicação EcoTrack para Desenvolvimento
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecotrack-app-dev
    ports:
      - "8080:8080"
      - "8081:8081" # Management port
      - "5005:5005"  # Debug port
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Spring Boot Configuration
      - SPRING_APPLICATION_NAME=mobilidade-sustentavel
      - SPRING_PROFILES_ACTIVE=docker,development

      # Database Configuration
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecotrack
      - SPRING_DATASOURCE_USERNAME=ecotrack
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      # JPA/Hibernate Configuration
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_JPA_SHOW_SQL=true

      # Flyway Configuration
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration

      # Security Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}

      # AI Integration
      - SPRING_SECRET_AI_KEY=${SPRING_SECRET_AI_KEY}

      # Actuator Configuration
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SERVER_PORT=8081

      # Debug Configuration
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

      # Logging Configuration
      - LOGGING_LEVEL_BR_COM_FIAP_ESG=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG

    volumes:
      - app_dev_logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  app_dev_logs:
    driver: local
