spring:
  application:
    name: mobilidade-sustentavel
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://postgres:5432/ecotrack
    username: ecotrack
    password: "${DB_PASSWORD}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  secret:
    ai:
      key: "${SPRING_SECRET_AI_KEY}"

app:
  co2-emission-factors:
    CARRO: 0.120
    MOTO: 0.070
    ONIBUS: 0.050
    METRO: 0.015
    TREM: 0.015
    BICICLETA: 0.0
    CAMINHADA: 0.0
    PATINETE: 0.0
    OUTRO: 0.100
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: "${JWT_EXPIRATION_MS}"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  health:
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  circuitbreaker:
    instances:
      aiInsightService:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:production}
  traces-sample-rate: 0.1

logging:
  level:
    org.springframework.security: WARN
    org.springframework.web: WARN
