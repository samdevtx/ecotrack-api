spring:
  application:
    name: mobilidade-sustentavel
  datasource:
    url: jdbc:postgresql://postgres:5432/ecotrack
    username: ecotrack
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  secret: 
    ai:
      key: "${SPRING_SECRET_AI_KEY}"

# Custom application properties
app:
  co2-emission-factors: # in kg CO2 per km
    CARRO: 0.120       # Example: Average gasoline car
    MOTO: 0.070        # Example: Average motorcycle
    ONIBUS: 0.050      # Example: Average bus (vehicle, not per passenger-km initially)
    METRO: 0.015       # Example: Metro/Train (electric, varies by grid)
    TREM: 0.015        # Alias for METRO or similar rail
    BICICLETA: 0.0
    CAMINHADA: 0.0
    PATINETE: 0.0      # Assuming electric scooter, low direct emission (grid dependent for charging)
    OUTRO: 0.100       # Default for other unspecified motorized transport
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: "${JWT_EXPIRATION_MS}" 

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  health:
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  circuitbreaker:
    instances:
      aiInsightService:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:production}
  traces-sample-rate: 0.1

logging:
  level:
    org.springframework.security: WARN
    org.springframework.web: WARN
