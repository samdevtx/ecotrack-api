name: CI/CD Pipeline - EcoTrack Mobilidade Sustentável

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Build & Test ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    name: 🧪 Build & Test
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecotrack
          POSTGRES_USER: ecotrack
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotrack -d ecotrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: 🔧 Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 🏗️ Build with Maven
      run: ./mvnw clean compile -B

    - name: 🧪 Run tests
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecotrack
        SPRING_DATASOURCE_USERNAME: ecotrack
        SPRING_DATASOURCE_PASSWORD: test_password
        DB_PASSWORD: test_password
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        JWT_EXPIRATION_MS: 3600000
        SPRING_SECRET_AI_KEY: ${{ secrets.SPRING_SECRET_AI_KEY }}
      run: ./mvnw test -B

    - name: 📦 Package application
      run: ./mvnw package -DskipTests -B

    - name: 📤 Upload test results
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: surefire-reports
        path: target/surefire-reports/*.xml

    - name: 📤 Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: jar-artifact
        path: target/*.jar

  # ── Job 2: Code Analysis ────────────────────────────────────────────────────
  code-analysis:
    runs-on: ubuntu-latest
    name: 🔍 Code Analysis
    needs: test

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache NVD database
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: nvd-${{ github.run_id }}
        restore-keys: nvd-

    - name: 🔍 Run SpotBugs
      run: ./mvnw spotbugs:check -B

    - name: 🛡️ Run OWASP Dependency Check
      # continue-on-error: NVD API started returning nanosecond timestamps that
      # dependency-check-maven cannot parse (ZonedDateTime index 23 error).
      # Bug is in the upstream plugin; re-enable once a fix is released.
      continue-on-error: true
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: |
        ./mvnw org.owasp:dependency-check-maven:12.2.1:check \
          -DfailBuildOnCVSS=7 \
          -DnvdApiKey=$NVD_API_KEY \
          -DsuppressionFile=dependency-check-suppressions.xml \
          -B

    - name: 📤 Upload OWASP report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: owasp-report
        path: target/dependency-check-report.html

  # ── Job 3: Docker Build & Push (main only) ──────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    name: 🐳 Build & Push Docker Image
    needs: [test, code-analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=main-
          type=raw,value=latest,enable=true

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ── Job 4: Trivy Image Scan (main only) ─────────────────────────────────────
  trivy-scan:
    runs-on: ubuntu-latest
    name: 🔒 Trivy Image Scan
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      security-events: write

    steps:
    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔒 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.35.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'

    - name: 📤 Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif

  # ── Job 5: Deploy to Staging (develop only) ─────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Staging
    needs: [test, code-analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: 🚀 Trigger Render staging deploy
      run: |
        curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}" \
          -o /dev/null -w "HTTP %{http_code}\n"

    - name: ⏳ Wait for staging to be healthy
      run: |
        echo "Polling ${{ secrets.STAGING_HEALTH_URL }} ..."
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.STAGING_HEALTH_URL }}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Staging healthy (attempt $i)"
            exit 0
          fi
          echo "Attempt $i/30 — HTTP $STATUS — retrying in 20s"
          sleep 20
        done
        echo "❌ Staging did not become healthy after 10 minutes"
        exit 1

  # ── Job 6: Deploy to Production (main only) ──────────────────────────────────
  deploy-production:
    runs-on: ubuntu-latest
    name: 🌟 Deploy to Production
    needs: [test, code-analysis, build-and-push, trivy-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: 🌟 Trigger Render production deploy
      run: |
        curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}" \
          -o /dev/null -w "HTTP %{http_code}\n"

    - name: ⏳ Wait for production to be healthy
      run: |
        echo "Polling ${{ secrets.PRODUCTION_HEALTH_URL }} ..."
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.PRODUCTION_HEALTH_URL }}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Production healthy (attempt $i)"
            exit 0
          fi
          echo "Attempt $i/30 — HTTP $STATUS — retrying in 20s"
          sleep 20
        done
        echo "❌ Production did not become healthy after 10 minutes"
        exit 1
