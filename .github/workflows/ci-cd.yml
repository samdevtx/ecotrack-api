name: CI/CD Pipeline - EcoTrack Mobilidade Sustentável

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: Build e Testes
  test:
    runs-on: ubuntu-latest
    name: 🧪 Build & Test
    permissions:
      contents: read

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          APP_USER: ecotrack
          APP_USER_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: 🔧 Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 🏗️ Build with Maven
      run: ./mvnw clean compile -B

    - name: 🧪 Run tests
      env:
        SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1521/XEPDB1
        SPRING_DATASOURCE_USERNAME: ecotrack
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        JWT_EXPIRATION_MS: 3600000
        SPRING_SECRET_AI_KEY: ${{ secrets.SPRING_SECRET_AI_KEY }}
      run: ./mvnw test -B

    - name: 📦 Package application
      run: ./mvnw package -DskipTests -B

    - name: 📤 Upload test results
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: surefire-reports
        path: target/surefire-reports/*.xml

    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jar-artifact
        path: target/*.jar

  # Job 2: Análise de Código e Segurança
  code-analysis:
    runs-on: ubuntu-latest
    name: 🔍 Code Analysis
    needs: test
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache NVD database
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: nvd-${{ github.run_id }}
        restore-keys: nvd-

    - name: 🔍 Run SpotBugs
      run: ./mvnw spotbugs:check -B

    - name: 🛡️ Run OWASP Dependency Check
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: |
        ./mvnw org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=7 \
          -DnvdApiKey=$NVD_API_KEY \
          -DsuppressionFile=dependency-check-suppressions.xml \
          -B

  # Job 3: Build e Push da Imagem Docker
  build-and-push:
    runs-on: ubuntu-latest
    name: 🐳 Build & Push Docker Image
    needs: [test, code-analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 4: Deploy para Staging
  deploy-staging:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Staging
    needs: build-and-push
    environment: staging
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Compose
      run: |
        # Simular deploy em staging usando docker-compose
        echo "🚀 Deploying to staging environment..."
        
        # Criar arquivo de ambiente para staging
        cat > .env.staging << EOF
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        JWT_EXPIRATION_MS=3600000
        SPRING_SECRET_AI_KEY=${{ secrets.SPRING_SECRET_AI_KEY }}
        ORACLE_PASSWORD=${{ secrets.ORACLE_PASSWORD }}
        COMPOSE_PROJECT_NAME=ecotrack-staging
        EOF
        
        # Simular deploy (em produção real, seria deploy para servidor)
        echo "✅ Staging deployment completed"
        echo "🌐 Staging URL: https://staging.ecotrack.com"

    - name: 🧪 Run staging tests
      run: |
        echo "🧪 Running staging smoke tests..."
        # Aqui executaríamos testes de integração no ambiente de staging
        echo "✅ Staging tests passed"

  # Job 5: Deploy para Produção
  deploy-production:
    runs-on: ubuntu-latest
    name: 🌟 Deploy to Production
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🌟 Deploy to Production
      run: |
        echo "🌟 Deploying to production environment..."
        
        # Criar arquivo de ambiente para produção
        cat > .env.production << EOF
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        JWT_EXPIRATION_MS=3600000
        SPRING_SECRET_AI_KEY=${{ secrets.SPRING_SECRET_AI_KEY }}
        ORACLE_PASSWORD=${{ secrets.ORACLE_PASSWORD }}
        COMPOSE_PROJECT_NAME=ecotrack-production
        EOF
        
        # Simular deploy de produção
        echo "✅ Production deployment completed"
        echo "🌐 Production URL: https://ecotrack.com"

    - name: 📊 Post-deployment verification
      run: |
        echo "📊 Running production health checks..."
        # Aqui executaríamos verificações de saúde da aplicação
        echo "✅ Production health checks passed"

  # Job 6: Notificações
  notify:
    runs-on: ubuntu-latest
    name: 📢 Notifications
    needs: [deploy-production]
    if: always()
    
    steps:
    - name: 📢 Notify deployment status
      run: |
        if [ "${{ needs.deploy-production.result }}" == "success" ]; then
          echo "✅ Pipeline completed successfully!"
          echo "🚀 Application deployed to production"
        else
          echo "❌ Pipeline failed"
          echo "🔍 Check logs for details"
        fi